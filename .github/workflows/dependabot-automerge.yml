name: Merge passing Dependabot PRs

on:
  workflow_run:
    workflows: ["Build and Deploy Jupyter Book", "CodeQL"]
    types: [completed]

# A separate workflow gives Dependabot CI read-only permissions. Never check out
# PR code or consume its artifacts in this privileged workflow.
permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'dynamic') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify current CI and merge Dependabot PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            let eventRun = context.payload.workflow_run;
            const workflowJobs = {".github/workflows/jupyter-book.yml": ["build", "julia-notebook-smokes"]};
            const requiredChecks = ["build", "julia-notebook-smokes"];
            const allowedSkips = new Set(["deploy"]);
            // Default-setup CodeQL runs use refs/pull/N/head as the branch.
            // Resolve their tested SHA back to the repository's actual PR CI run.
            if (!Object.hasOwn(workflowJobs, eventRun.path)) {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, event: 'pull_request', head_sha: eventRun.head_sha, per_page: 100,
              });
              eventRun = runs.workflow_runs.find(candidate => Object.hasOwn(workflowJobs, candidate.path));
              if (!eventRun) {
                core.info('No trusted PR CI run exists for the completed scan head.');
                return;
              }
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: eventRun.id,
            });
            if (run.event !== 'pull_request' || run.conclusion !== 'success' ||
                run.status !== 'completed' || run.run_attempt !== eventRun.run_attempt ||
                !Object.hasOwn(workflowJobs, run.path) ||
                run.head_repository?.full_name !== `${owner}/${repo}`) {
              core.info('The completed run is no longer eligible.');
              return;
            }
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            // workflow_run.pull_requests can be empty for Dependabot runs.
            const candidates = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: repository.default_branch,
              head: `${owner}:${run.head_branch}`, per_page: 100,
            });
            for (const candidate of candidates) {
              // GitHub computes mergeability asynchronously after a base update.
              // Reading a PR can start that computation and return null initially.
              let pr;
              for (let attempt = 0; attempt < 6; attempt++) {
                ({ data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: candidate.number,
                }));
                if (pr.mergeable !== null && pr.mergeable_state !== 'unknown') break;
                if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 2000));
              }
              if (pr.state !== 'open' || pr.draft ||
                  pr.user.login !== 'dependabot[bot]' || pr.user.type !== 'Bot' ||
                  pr.head.repo?.full_name !== `${owner}/${repo}` ||
                  !pr.head.ref.startsWith('dependabot/') ||
                  pr.base.ref !== repository.default_branch || pr.head.sha !== run.head_sha ||
                  pr.mergeable !== true || pr.mergeable_state !== 'clean') {
                core.info(`PR #${pr.number} is not eligible: state=${pr.state}, ` +
                  `mergeable=${pr.mergeable}, mergeable_state=${pr.mergeable_state}, ` +
                  `current_head=${pr.head.sha}, tested_head=${run.head_sha}.`);
                continue;
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
              });
              if (!workflowJobs[run.path].every(name => jobs.some(job =>
                  job.name === name && job.status === 'completed' && job.conclusion === 'success'))) {
                core.info('Every required CI job must pass.');
                continue;
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const dependencyFiles = new Set(['pyproject.toml', 'uv.lock', 'requirements-book.txt']);
              const dependencyOnly = files.length > 0 && files.every(file => dependencyFiles.has(file.filename));
              // Default CodeQL setup can omit Actions analysis for dependency-only
              // changes. Accept only its specific neutral Actions-config warning.
              const neutralCodeQLIds = new Set(dependencyOnly ?
                (await github.paginate(github.rest.checks.listForRef, {
                  owner, repo, ref: run.head_sha, per_page: 100,
                })).filter(check => check.name === 'CodeQL' && check.status === 'completed' &&
                  check.conclusion === 'neutral' && check.app?.slug === 'github-advanced-security' &&
                  check.output?.title === '1 configuration not found' &&
                  (check.output.summary || '').includes('/language:actions'))
                  .map(check => check.node_id) : []);
              const result = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      headRefOid
                      reviewDecision
                      latestReviews(first: 100) {
                        pageInfo { hasNextPage }
                        nodes { state }
                      }
                      reviewThreads(first: 100) {
                        pageInfo { hasNextPage }
                        nodes { isResolved }
                      }
                      commits(last: 1) {
                        nodes { commit { statusCheckRollup {
                          state
                          contexts(first: 100) {
                            pageInfo { hasNextPage }
                            nodes {
                              ... on CheckRun { id name status conclusion }
                              ... on StatusContext { context state }
                            }
                          }
                        } } }
                      }
                    }
                  }
                }`, { owner, repo, number: pr.number });
              const current = result.repository.pullRequest;
              const checks = current.commits.nodes[0]?.commit.statusCheckRollup;
              if (current.headRefOid !== run.head_sha ||
                  ['CHANGES_REQUESTED', 'REVIEW_REQUIRED'].includes(current.reviewDecision) ||
                  current.latestReviews.pageInfo.hasNextPage ||
                  current.latestReviews.nodes.some(review => review.state === 'CHANGES_REQUESTED') ||
                  current.reviewThreads.pageInfo.hasNextPage ||
                  current.reviewThreads.nodes.some(thread => !thread.isResolved) ||
                  checks?.state !== 'SUCCESS' || checks.contexts.pageInfo.hasNextPage ||
                  !requiredChecks.every(name => checks.contexts.nodes.some(check => check.name === name &&
                    check.status === 'COMPLETED' && check.conclusion === 'SUCCESS')) ||
                  checks.contexts.nodes.some(check => check.status
                    ? check.status !== 'COMPLETED' || (check.conclusion !== 'SUCCESS' &&
                      !(check.conclusion === 'SKIPPED' && allowedSkips.has(check.name)) &&
                      !(check.conclusion === 'NEUTRAL' && check.name === 'CodeQL' && neutralCodeQLIds.has(check.id)))
                    : check.state !== 'SUCCESS')) {
                core.info(`PR #${pr.number} still has pending checks or review blockers.`);
                continue;
              }
              // The SHA guard prevents a new, untested commit from being merged.
              // GitHub's delete_branch_on_merge setting removes the source branch.
              const { data: merged } = await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, sha: run.head_sha, merge_method: 'squash',
              });
              if (!merged.merged) {
                core.setFailed(`PR #${pr.number} was not merged: ${merged.message}`);
              } else {
                core.info(`Merged Dependabot PR #${pr.number} at ${merged.sha}.`);
                // GITHUB_TOKEN merges suppress push events. Dispatch the trusted
                // default-branch build explicitly so the published book stays current.
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'jupyter-book.yml', ref: repository.default_branch,
                });
              }
            }
